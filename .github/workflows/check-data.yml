name: Validate Saab research database

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source-scoped records
        run: python3 tools/validate.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate unranked tier evidence baseline
        run: python3 tools/build_tier_readiness.py --check
      - name: Generate repeatable coverage census
        run: python3 tools/coverage.py --format markdown
