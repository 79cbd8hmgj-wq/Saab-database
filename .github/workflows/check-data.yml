name: Validate Saab research database

on:
  push:
    branches: [main, 'feature/saab-comparison-model-*']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source-scoped records
        run: python3 tools/validate.py
      - name: Validate reproducible component catalog and evidence guards
        run: python3 tools/component_catalog.py --check
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit existing research reuse and overlap
        run: python3 tools/audit_research_reuse.py --summary
      - name: Verify legacy issue classification and mechanism crosswalk
        run: python3 tools/build_legacy_issue_index.py --check --summary
      - name: Check original part and shared research blocker reconciliation
        run: python3 tools/check_part_gap_reconciliation.py --check --summary
      - name: Reconcile all source-backed records across sixteen vehicle systems
        run: python3 tools/build_system_evidence_index.py --check --summary
      - name: Verify complete B207/FA57 purchase engineering batch
        run: python3 tools/check_ng93_engineering_batch.py --check --summary
      - name: Validate unranked tier evidence baseline
        run: python3 tools/build_tier_readiness.py --check
      - name: Generate repeatable coverage census
        run: python3 tools/coverage.py --format markdown
